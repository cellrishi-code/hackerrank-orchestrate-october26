name: Ghost Data audit validation

on:
  push:
    branches:
      - agent/ghost-data-solver
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out participant repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: code/requirements.txt
      - name: Install evidence extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils
          python -m pip install --upgrade pip
          python -m pip install -r code/requirements.txt
      - name: Compile all Python files
        run: python -m py_compile code/audit_engine.py code/main.py code/evaluation/main.py code/package.py
      - name: Generate and validate all 518 predictions
        shell: bash
        run: |
          python code/main.py
      - name: Evaluate public samples and safety cases
        run: python code/evaluation/main.py
      - name: Package submission code
        run: python code/package.py
      - name: Upload generated deliverables
        uses: actions/upload-artifact@v4
        with:
          name: ghost-data-submission
          path: |
            output.csv
            code.zip
            run_stats.json
            log.txt
            code/evaluation/evaluation_report.md
            code/evaluation/usage_report.md
          if-no-files-found: error
          retention-days: 7
